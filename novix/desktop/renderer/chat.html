<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- chat card -->
		<div class="card" id="card">
			<!-- Sidebar -->
			<div class="sidebar" id="sidebar">
				<div class="sidebar-logo">
					<span class="logo-dot"></span>
					<h3>Synola</h3>
				</div>
				<div class="sidebar-header">
					<button id="new-chat">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none">
							<path
								d="M12 5V19M5 12H19"
								stroke="white"
								stroke-width="2"
								stroke-linecap="round"
							/>
						</svg>
						<span>New Chat</span>
					</button>
				</div>
				<div id="conversation-list"></div>
			</div>

			<!-- Chat Content -->
			<div class="chat-area">
				<div class="header">
					<button class="menu-btn" id="menuBtn">
						<svg width="22" height="22" viewBox="0 0 24 24" fill="none">
							<rect x="3" y="4" width="6" height="16" rx="1.5" fill="white" />
							<rect
								x="11"
								y="4"
								width="10"
								height="16"
								rx="1.5"
								stroke="white"
								stroke-width="2"
							/>
						</svg>
					</button>
					<div class="text-center">Synola</div>
					<button id="closeBtn" class="close-btn" title="Close">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none">
							<path
								d="M18 6L6 18M6 6L18 18"
								stroke="white"
								stroke-width="2"
								stroke-linecap="round"
							/>
						</svg>
					</button>
				</div>

				<div id="messages" class="messages">
					<div class="bot bubble">Hello! I am Synola, How can I help you?</div>
				</div>

				<div class="input-area">
					<textarea id="msg" placeholder="Ask anything..."></textarea>
					<button id="send">➜</button>
				</div>
			</div>
		</div>
		<script src="chat.js"></script>
	</body>
</html>
